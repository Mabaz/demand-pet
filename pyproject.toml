[project]
name = "demand-pet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maria", email = "bazm7972@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "loguru>=0.7.3",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
demand-pet = "demand_pet:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
